<!--
# N-back Voz (nback-voz-portable) · v1 · 73914-carpincho

## Qué es
Juego de memoria hablado. EL USUARIO ELIGE LAS PALABRAS; el programa solo
escucha, chequea y repite si hay error. Nunca propone palabras.

Nivel N (2 a 9):
- Vuelta 1: el usuario dice N palabras cualesquiera.
- Cada vuelta siguiente: repite las últimas N-1 de la vuelta anterior y agrega 1 nueva.
- Bien: el programa dice "okey" (o beep, o nada) y sigue.
- Mal: el programa dice SOLO las N-1 palabras que había que repetir. Nada más.
- Vuelta 1 con más de N palabras: dice solo el número ("tres").
Regla de diseño: respuestas habladas mínimas. No agregar frases explicativas.

## Cómo corre
Un solo HTML, sin dependencias. Necesita Chrome con micrófono, por
https o localhost (en file:// el micrófono suele estar bloqueado) e internet
(el reconocimiento de Chrome es en la nube). Idioma fijo: es-AR.

## Arquitectura (todo en este archivo)
1. LÓGICA PURA (entre los marcadores LOGIC y END LOGIC, testeable en node):
   - tokenize(str): minúsculas, saca puntuación, parte por espacios.
   - phon(w): forma fonética española (b=v, s=z=ce, k=c=qu, h muda, ll=y,
     ge=je, letras dobles) para tolerar homófonos del reconocedor.
   - lev / tol / simStr: Levenshtein con tolerancia según largo
     (hasta 4 letras: 0; 5 a 8: 1; 9 o más: 2).
   - Token = {t: texto, v: [variantes fonéticas]}. Item = {text, v: [...]}.
   - matchSeq(items, toks): alinea ítems esperados contra tokens oídos.
     Acepta palabra partida (1 ítem = hasta 3 tokens) y pegada (2 ítems = 1 token).
     Devuelve full (con k tokens consumidos), part (va bien, falta) o fail.
   - evalTurn(state, buf): ok | wait (falta) | wait1 (falta solo la nueva) |
     count (vuelta 1 con palabras de más) | bad (error, trae exp).
   - buildCands(alts): arma candidatos con las alternativas del reconocedor
     (las de igual cantidad de palabras se funden como variantes).
   - judge(state, buf, cands): elige el mejor candidato.
2. VOZ:
   - Reconocimiento: webkitSpeechRecognition, continuous=false, se reinicia
     solo en onend. El resultado se toma en onend (último onresult), no por
     isFinal, porque en Android isFinal no es confiable.
   - buf acumula tokens entre sesiones: el usuario puede hacer pausas.
   - say(): corta el micrófono, habla, y lo reabre al terminar (con timeout
     de respaldo porque onend del TTS a veces no dispara en Android).
   - Modo beep: no corta el micrófono, es el más rápido.
3. UI: círculo central (tocar = empezar/parar), nivel con − y +, botones
   Repetir (dice las que hay que repetir) y De cero, ajustes plegables.
   Ajustes y mejor racha por nivel quedan en localStorage (clave nbv1).

## Estado
state = {n, items} (items = últimas N palabras válidas), buf = tokens de la
vuelta en curso, st = {racha, vueltas, err}, cfg = {n, ok, sil, rate}.

## Para próximas versiones
- Mantener este MD actualizado y cambiar número y animal/ciudad del nombre.
- No tocar la regla de hablar corto.
- Ideas no hechas: elegir idioma, tolerancia configurable, historial de sesiones.
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e1013">
<title>N-back Voz</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#0e1013;color:#e9e6df;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 display:flex;flex-direction:column;align-items:center;padding:14px 16px 18px;user-select:none}
header{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin:0;color:#8d949e}
.niv{display:flex;align-items:center;gap:10px}
.niv button{width:44px;height:44px;border-radius:50%;border:1px solid #2b3038;background:#171a1f;color:#e9e6df;font-size:24px;line-height:1}
.niv div{text-align:center;min-width:44px}
.niv b{display:block;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.niv small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8d949e}
main{flex:1;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
#orb{width:min(58vw,240px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:54px;font-weight:700;border:2px solid #2b3038;background:#171a1f;color:#8d949e;transition:background .15s,border-color .15s,color .15s}
#orb.on{border-color:#d9a441;color:#d9a441;animation:lat 1.6s ease-in-out infinite}
#orb.talk{border-color:#6aa7d8;color:#6aa7d8}
#orb.ok{background:#1f6b45;border-color:#35c27c;color:#fff;animation:none}
#orb.bad{background:#7a2626;border-color:#e2584f;color:#fff;animation:none}
@keyframes lat{0%,100%{box-shadow:0 0 0 0 rgba(217,164,65,.35)}50%{box-shadow:0 0 0 18px rgba(217,164,65,0)}}
@media (prefers-reduced-motion:reduce){#orb.on{animation:none}}
#hint{font-size:22px;font-weight:600;min-height:28px;text-align:center}
#heard,#era{font-size:16px;min-height:21px;text-align:center;color:#8d949e;max-width:100%;overflow-wrap:anywhere}
#era{color:#f0b0aa;font-weight:600}
.stats{width:100%;max-width:460px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stats div{background:#171a1f;border-radius:10px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8d949e}
.btns{width:100%;max-width:460px;display:grid;grid-template-columns:2fr 1fr;gap:8px}
.btns button{height:52px;border-radius:12px;border:1px solid #2b3038;background:#171a1f;color:#e9e6df;font-size:17px;font-weight:600}
.btns button:active,.niv button:active{background:#252a32}
details{width:100%;max-width:460px;margin-top:10px;color:#8d949e;font-size:14px}
summary{padding:6px 0}
.aj{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;align-items:center;padding:6px 0}
select{height:40px;border-radius:8px;border:1px solid #2b3038;background:#171a1f;color:#e9e6df;font-size:15px;padding:0 8px}
</style>
</head>
<body>
<header>
  <h1>N-back voz</h1>
  <div class="niv">
    <button id="menos" aria-label="Bajar nivel">−</button>
    <div><b id="nval">3</b><small>nivel</small></div>
    <button id="mas" aria-label="Subir nivel">+</button>
  </div>
</header>

<main>
  <div id="orb" role="button" aria-label="Empezar o parar">▶</div>
  <div id="hint">Tocá para empezar</div>
  <div id="heard"></div>
  <div id="era"></div>
</main>

<div class="stats">
  <div><b id="sRacha">0</b><small>racha</small></div>
  <div><b id="sMejor">0</b><small>mejor</small></div>
  <div><b id="sVueltas">0</b><small>vueltas</small></div>
  <div><b id="sErr">0</b><small>errores</small></div>
</div>

<div class="btns">
  <button id="rep">Repetir</button>
  <button id="cero">De cero</button>
</div>

<details>
  <summary>Ajustes</summary>
  <div class="aj">
    <label for="cOk">Cuando está bien</label>
    <select id="cOk"><option value="voz">Dice "okey"</option><option value="beep">Beep (más rápido)</option><option value="mudo">Solo pantalla</option></select>
    <label for="cSil">Repetir si me callo</label>
    <select id="cSil"><option value="0">No</option><option value="10">10 s</option><option value="20">20 s</option><option value="30">30 s</option></select>
    <label for="cRate">Velocidad de la voz</label>
    <select id="cRate"><option value="0.8">Lenta</option><option value="1">Normal</option><option value="1.3">Rápida</option><option value="1.6">Muy rápida</option></select>
  </div>
</details>

<script>
/*LOGIC*/
function tokenize(str){
  return (str||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(Boolean);
}
function phon(w){
  let s=w.toLowerCase().replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\u0001/g,'ñ');
  s=s.replace(/ch/g,'\u0002').replace(/h/g,'');
  s=s.replace(/qu(?=[ei])/g,'k').replace(/q/g,'k');
  s=s.replace(/gu(?=[ei])/g,'\u0003').replace(/g(?=[ei])/g,'j').replace(/\u0003/g,'g');
  s=s.replace(/ll/g,'y').replace(/v/g,'b').replace(/z/g,'s').replace(/c(?=[ei])/g,'s').replace(/c/g,'k');
  s=s.replace(/x/g,'ks').replace(/w/g,'u').replace(/\u0002/g,'ch');
  s=s.replace(/(.)\1+/g,'$1');
  return s||w;
}
function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=[]; for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function tol(len){ return len<=4?0:(len<=8?1:2); }
function simStr(a,b){ return a===b || lev(a,b)<=tol(Math.max(a.length,b.length)); }
function combos(toks){
  let out=[''];
  for(const t of toks){
    const nx=[];
    for(const o of out) for(const v of t.v){ if(nx.length<40) nx.push(o+v); }
    out=nx;
  }
  return out;
}
function simTI(toks,variants){
  const cs=combos(toks);
  for(const c of cs) for(const v of variants) if(simStr(c,v)) return true;
  return false;
}
function matchSeq(items,toks){
  function go(i,k){
    if(i===items.length) return {st:'full',k:k};
    if(k===toks.length) return {st:'part'};
    let part=false;
    for(let m=1;m<=3 && k+m<=toks.length;m++){
      if(simTI(toks.slice(k,k+m),items[i].v)){
        const r=go(i+1,k+m);
        if(r.st==='full') return r;
        if(r.st==='part') part=true;
      }
    }
    if(i+1<items.length){
      const both=[];
      for(const a of items[i].v) for(const b of items[i+1].v) both.push(a+b);
      if(simTI([toks[k]],both)){
        const r=go(i+2,k+1);
        if(r.st==='full') return r;
        if(r.st==='part') part=true;
      }
    }
    return part?{st:'part'}:{st:'fail'};
  }
  return go(0,0);
}
function evalTurn(state,buf){
  if(state.items.length===0){
    if(buf.length<state.n) return {r:'wait'};
    if(buf.length>state.n) return {r:'count'};
    return {r:'ok',newItems:buf.map(t=>({text:t.t,v:t.v.slice()}))};
  }
  const exp=state.items.slice(-(state.n-1));
  const m=matchSeq(exp,buf);
  if(m.st==='fail') return {r:'bad',exp:exp};
  if(m.st==='part') return {r:'wait'};
  const rest=buf.slice(m.k);
  if(!rest.length) return {r:'wait1'};
  return {r:'ok',newItems:[{text:rest.map(t=>t.t).join(' '),v:combos(rest)}]};
}
function buildCands(alts){
  const toks=alts.map(tokenize).filter(a=>a.length);
  const cands=[],seen={};
  toks.forEach(tk=>{
    const key=tk.join(' '); if(seen[key]) return; seen[key]=1;
    cands.push(tk.map((w,i)=>{
      const v={}; v[phon(w)]=1;
      toks.forEach(o=>{ if(o.length===tk.length) v[phon(o[i])]=1; });
      return {t:w,v:Object.keys(v)};
    }));
  });
  return cands;
}
function judge(state,buf,cands){
  const rank={ok:4,wait1:3,wait:2,count:1,bad:0};
  let best=null;
  for(const c of cands){
    const nb=buf.concat(c), r=evalTurn(state,nb); r.buf=nb;
    if(!best||rank[r.r]>rank[best.r]) best=r;
  }
  return best;
}
/*END LOGIC*/

/* ---------- UI y voz ---------- */
const $=id=>document.getElementById(id);
const NUM=['','','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
const KEY='nbv1';
let cfg={n:3,ok:'voz',sil:0,rate:1,best:{}};
try{ Object.assign(cfg,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(cfg)); }catch(e){} }

let state={n:cfg.n,items:[]}, buf=[], st={racha:0,vueltas:0,err:0};
let running=false, speaking=false, recActive=false, waitNew=false;
let rec=null, lastAlts=null, silT=null, flashT=null, actx=null, wake=null, voice=null;

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function hintBase(){
  if(!running) return 'Tocá para empezar';
  if(!state.items.length) return 'Decí '+state.n+' palabras';
  if(waitNew) return '+ 1 nueva';
  return (state.n-1)+' + 1 nueva';
}
function draw(){
  $('nval').textContent=state.n;
  $('hint').textContent=hintBase();
  $('sRacha').textContent=st.racha;
  $('sMejor').textContent=cfg.best[state.n]||0;
  $('sVueltas').textContent=st.vueltas;
  $('sErr').textContent=st.err;
  orbIdle();
}
function orbIdle(){
  if(flashT) return;
  const o=$('orb');
  if(!running){ o.className=''; o.textContent='▶'; }
  else if(speaking){ o.className='talk'; o.textContent='…'; }
  else { o.className='on'; o.textContent='●'; }
}
function flash(cls,txt,ms){
  const o=$('orb'); clearTimeout(flashT);
  o.className=cls; o.textContent=txt;
  flashT=setTimeout(()=>{ flashT=null; orbIdle(); },ms);
}

function pickVoice(){
  if(!window.speechSynthesis) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
  const pref=['es-AR','es_AR','es-US','es_US','es-MX','es_MX','es-ES','es_ES'];
  voice=null;
  for(const p of pref){ voice=vs.find(v=>v.lang===p); if(voice) break; }
  if(!voice) voice=vs[0]||null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }

function say(text){
  if(!window.speechSynthesis){ return; }
  speaking=true; lastAlts=null;
  try{ rec&&rec.abort(); }catch(e){}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang='es-US';
  u.rate=+cfg.rate||1;
  let done=false;
  const fin=()=>{
    if(done) return; done=true; clearTimeout(tm);
    speaking=false; orbIdle(); armSil();
    setTimeout(startRec,120);
  };
  const tm=setTimeout(fin,1800+text.length*130);
  u.onend=fin; u.onerror=fin;
  speechSynthesis.speak(u);
  orbIdle();
}
function beep(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=880; o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.start(t); o.stop(t+0.13);
  }catch(e){}
}

function armSil(){
  clearTimeout(silT);
  if(!running||!(+cfg.sil)) return;
  silT=setTimeout(()=>{
    if(running&&!speaking&&state.items.length&&!waitNew) repetir(); else armSil();
  },cfg.sil*1000);
}

function mkRec(){
  rec=new SR();
  rec.lang='es-AR'; rec.continuous=false; rec.interimResults=true; rec.maxAlternatives=5;
  rec.onstart=()=>{ recActive=true; };
  rec.onresult=e=>{
    let alts;
    if(e.results.length===1){
      alts=[]; for(let i=0;i<e.results[0].length;i++) alts.push(e.results[0][i].transcript);
    }else{
      let s=''; for(let i=0;i<e.results.length;i++) s+=' '+e.results[i][0].transcript;
      alts=[s];
    }
    lastAlts=alts;
    const pre=buf.map(t=>t.t).join(' ');
    $('heard').textContent=(pre+' '+(alts[0]||'')).trim().toLowerCase();
    armSil();
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      parar(); $('hint').textContent='Sin permiso de micrófono';
      $('heard').textContent='Abrilo por localhost o https y permití el micrófono.';
    }else if(e.error==='network'){
      $('heard').textContent='Sin internet para reconocer la voz.';
    }
  };
  rec.onend=()=>{
    recActive=false;
    const a=lastAlts; lastAlts=null;
    if(running&&a) commit(a);
    if(running&&!speaking) setTimeout(startRec,60);
  };
}
function startRec(){
  if(!running||speaking||recActive) return;
  try{ rec.start(); }catch(e){}
}
setInterval(()=>{ if(running&&!speaking&&!recActive) startRec(); },2000);

function commit(alts){
  const cands=buildCands(alts);
  if(!cands.length) return;
  const r=judge(state,buf,cands);
  const oido=r.buf.map(t=>t.t).join(' ');
  if(r.r==='ok'){
    state.items=state.items.concat(r.newItems).slice(-state.n);
    buf=[]; waitNew=false;
    st.vueltas++; st.racha++;
    if(st.racha>(cfg.best[state.n]||0)){ cfg.best[state.n]=st.racha; save(); }
    $('heard').textContent=''; $('era').textContent='';
    draw(); flash('ok','OK',700);
    if(navigator.vibrate) navigator.vibrate(40);
    if(cfg.ok==='voz') say('okey'); else if(cfg.ok==='beep') beep();
  }else if(r.r==='wait'||r.r==='wait1'){
    buf=r.buf; waitNew=(r.r==='wait1');
    $('heard').textContent=oido; $('hint').textContent=hintBase();
  }else if(r.r==='count'){
    buf=[]; waitNew=false;
    $('heard').textContent='oí: '+oido; $('era').textContent='son '+state.n;
    flash('bad','✗',900);
    say(NUM[state.n]);
  }else{
    buf=[]; waitNew=false;
    st.err++; st.racha=0;
    const era=r.exp.map(i=>i.text);
    $('heard').textContent='oí: '+oido; $('era').textContent='era: '+era.join(', ');
    draw(); flash('bad','✗',900);
    if(navigator.vibrate) navigator.vibrate([60,60,60]);
    say(era.join(', '));
  }
  armSil();
}

function repetir(){
  if(!running||!state.items.length) return;
  buf=[]; waitNew=false;
  const era=state.items.slice(-(state.n-1)).map(i=>i.text);
  $('era').textContent='era: '+era.join(', '); $('heard').textContent='';
  $('hint').textContent=hintBase();
  say(era.join(', '));
}
function deCero(){
  state.items=[]; buf=[]; waitNew=false; st={racha:0,vueltas:0,err:0};
  $('heard').textContent=''; $('era').textContent='';
  lastAlts=null; try{ rec&&rec.abort(); }catch(e){}
  draw();
}
async function pedirWake(){
  try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request('screen'); }catch(e){}
}
function empezar(){
  if(!SR){ $('hint').textContent='Este navegador no reconoce voz'; $('heard').textContent='Usá Chrome.'; return; }
  if(!rec) mkRec();
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  if(window.speechSynthesis){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }
  running=true; deCero(); pedirWake(); startRec(); armSil();
}
function parar(){
  running=false; speaking=false; clearTimeout(silT);
  lastAlts=null; try{ rec&&rec.abort(); }catch(e){}
  if(window.speechSynthesis) speechSynthesis.cancel();
  try{ wake&&wake.release(); }catch(e){} wake=null;
  buf=[]; waitNew=false; draw();
}
function nivel(d){
  const n=Math.max(2,Math.min(9,state.n+d));
  if(n===state.n) return;
  state.n=n; cfg.n=n; save(); deCero();
}

$('orb').onclick=()=>{ running?parar():empezar(); };
$('menos').onclick=()=>nivel(-1);
$('mas').onclick=()=>nivel(1);
$('rep').onclick=repetir;
$('cero').onclick=deCero;
[['cOk','ok'],['cSil','sil'],['cRate','rate']].forEach(([id,k])=>{
  $(id).value=String(cfg[k]);
  $(id).onchange=e=>{ cfg[k]=(k==='ok')?e.target.value:+e.target.value; save(); armSil(); };
});
document.addEventListener('visibilitychange',()=>{ if(running&&document.visibilityState==='visible') pedirWake(); });
draw();
</script>
</body>
</html>
